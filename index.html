<!doctype html>
<html lang="pt-BR" data-tema="claro" data-fonte="1">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Meu INSS: consulte seu benefício, peça aposentadoria e use outros serviços do INSS pelo celular."
    />
    <meta name="theme-color" content="#1351b4" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Atkinson Hyperlegible: fonte feita para leitura com baixa visão -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap"
    />
    <title>Meu INSS — Serviços do INSS pelo celular</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- VLibras: tradutor oficial do Governo Federal para Libras.
         O botão "Libras" da barra de acessibilidade abre este widget. -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      new window.VLibras.Widget("https://vlibras.gov.br/app");
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
